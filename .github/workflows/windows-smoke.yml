name: Windows smoke

# Verifies the pushed commit itself on GitHub's own Windows host. A production Windows machine
# receives a commit when its installed version's gate script fast-forwards to it and validates
# the result with its own (older) file list. On a push to main that runs for real against GitHub;
# on any other ref the same validation is reproduced without the network, because until the merge
# no gate script can fast-forward to the pushed commit. The current gates and the brief pipeline
# then run on the same commit. Nothing here changes main or touches a production machine.
# Diagnostics go to annotations and evidence is pushed to a scratch branch, so the result can be
# inspected without signing in (the workflow token cannot post commit statuses).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ARTIFACT_BRANCH: ci/windows-smoke
  # Installed versions a production machine may still be on. Each one's own gate script must be
  # able to fast-forward to the pushed commit. Add the previous release whenever a new one ships.
  UPGRADE_ORIGINS: '1.15.0=6fb1d3bc3bfeb74fdaa813200ba18223903a7dbd;2.0.3=4ab4f3f0aac1f4c77ddbf76e46ad398f92c7b14c;2.0.4=d9595b8a388841fcd7d03a7d0ed32f42f6a4643b;2.1.0=c24dca06b747b81a252d1e66673569c25003c4a7'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { Write-Host 'ffmpeg already on PATH'; exit 0 }
          try {
            $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest' -Headers @{ 'User-Agent' = 'news-editor-smoke' }
            $asset = $release.assets | Where-Object { $_.name -match '^ffmpeg-n[\d.]+-latest-win64-gpl-[\d.]+\.zip$' } | Select-Object -First 1
            if (-not $asset) { throw 'no win64 gpl asset in the BtbN latest release' }
            $zip = Join-Path $env:RUNNER_TEMP $asset.name
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip -TimeoutSec 420
            $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $bin = Get-ChildItem $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | Select-Object -ExpandProperty DirectoryName
            $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "installed $($asset.name)"
          } catch {
            Write-Host "static build failed ($($_.Exception.Message)); falling back to Chocolatey"
            Choco Install ffmpeg -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Toolchain
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Note([string]$m) {
            $one = (($m -replace "`r?`n", ' | ') -replace '%', '%25')
            if ($one.Length -gt 3000) { $one = $one.Substring(0, 3000) + '...' }
            "::notice::$one"
            $one | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'notes.log') -Append -Encoding utf8
          }
          try {
            $ff = (ffmpeg -version | Select-Object -First 1)
            $fp = (ffprobe -version | Select-Object -First 1)
            Note "TOOLCHAIN ffmpeg: $ff | ffprobe: $fp | $(pwsh --version) | $(python --version)"
            $font = 'C:\Windows\Fonts\msyhbd.ttc'
            if (-not (Test-Path -LiteralPath $font)) {
              $cjk = Get-ChildItem C:\Windows\Fonts -Include msyh*, simhei*, Deng*, simsun*, *NotoSans*CJK*, *SourceHan* -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
              Note "FONT Microsoft YaHei Bold is not installed on this image; CJK fonts present: $($cjk -join ', ')"
              $font = Join-Path $env:RUNNER_TEMP 'NotoSansCJKsc-Bold.otf'
              $urls = @(
                'https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf',
                'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf'
              )
              $done = $false
              foreach ($u in $urls) {
                try {
                  Invoke-WebRequest -Uri $u -OutFile $font -TimeoutSec 240
                  if ((Get-Item $font).Length -gt 1MB) { $done = $true; break }
                } catch { Write-Host "font download failed from $u : $($_.Exception.Message)" }
              }
              if (-not $done) { throw 'no CJK bold font available on this host' }
            }
            python -c "from PIL import ImageFont; f = ImageFont.truetype(r'$font', 40); print('font ok:', f.getname())"
            if ($LASTEXITCODE -ne 0) { throw 'Pillow cannot load the selected font' }
            Note "FONT smoke font: $font"
            "SMOKE_FONT=$font" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            $msg = (("$($_.Exception.GetType().Name): $($_.Exception.Message)" -replace "`r?`n", ' | ') -replace '%', '%25')
            "::error title=Toolchain::$msg"
            exit 1
          }

      - name: PowerShell syntax
        id: syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
          "::notice::POWERSHELL all scripts parse on $(pwsh --version)"

      - name: Upgrade rehearsal (installed versions' gate scripts against the pushed commit)
        id: upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # The gate script of one commit, cut after its last function and pointed at the
          # checked-out tree, runs exactly the validation a machine performs after fast-forwarding,
          # minus the network part.
          function Test-GateScript([string]$Sha, [string]$Label) {
            $source = (git show "$($Sha):scripts/ensure_latest_skill.ps1") -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "cannot read the gate script of $Label" }
            $tokens = $null
            $parseErrors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw "the gate script of $Label does not parse" }
            $functions = $ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)
            foreach ($name in 'Read-And-ValidateConfig', 'Test-CoreFiles') {
              if (-not ($functions | Where-Object { $_.Name -eq $name })) { throw "the gate script of $Label has no $name" }
            }
            $scriptsDir = (Resolve-Path scripts).Path
            $head = $ast.Extent.Text.Substring(0, ($functions | Select-Object -Last 1).Extent.EndOffset)
            $tail = 'try { Read-And-ValidateConfig; Test-CoreFiles; Write-Output "VALID version=$($script:Version)" }',
                    'catch { Write-Output "INVALID $($_.Exception.Message)"; exit 1 }'
            $check = Join-Path $env:RUNNER_TEMP "gate-check-$Label.ps1"
            Set-Content -LiteralPath $check -Value (@($head.Replace('$PSScriptRoot', "'$scriptsDir'")) + $tail) -Encoding utf8
            $result = & pwsh -NoProfile -File $check 2>&1
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "the gate script of $Label rejects the checked-out tree: $($result -join ' ')" }
            "$($result -join ' ')"
          }
          $lines = @()
          try {
            if ($env:GITHUB_REF -eq 'refs/heads/main') {
              # The pushed commit is GitHub main itself, so every gate script runs for real: the
              # installed version is checked out, its own gate fast-forwards to the pushed commit
              # over the network and validates the result, then the new gate confirms LATEST_READY.
              foreach ($origin in ($env:UPGRADE_ORIGINS -split ';')) {
                $label, $sha = $origin -split '=', 2
                git checkout -q -B main $sha
                if ($LASTEXITCODE -ne 0) { exit 1 }
                $dirty = git status --porcelain=v1 --untracked-files=all
                if ($dirty) { throw "worktree is not clean: $dirty" }
                $gate = & pwsh -NoProfile -File scripts/ensure_latest_skill.ps1 -RunId ([guid]::NewGuid().ToString())
                $code = $LASTEXITCODE
                $json = $gate | Where-Object { "$_" -like '{*' } | Select-Object -Last 1
                $status = if ($json) { ("$json" | ConvertFrom-Json).status } else { 'NO_JSON' }
                $version = (Get-Content VERSION).Trim()
                $head = git rev-parse HEAD
                $lines += "$label -> $version/$($head.Substring(0, 7)) exit=$code status=$status"
                if ($code -ne 0 -or $status -ne 'UPDATED_READY_RELOAD' -or $head -ne $env:GITHUB_SHA) {
                  throw "upgrade from $label failed: exit=$code status=$status head=$head output: $($gate -join ' ')"
                }
              }
              $gate = & pwsh -NoProfile -File scripts/ensure_latest_skill.ps1 -RunId ([guid]::NewGuid().ToString())
              $code = $LASTEXITCODE
              $json = $gate | Where-Object { "$_" -like '{*' } | Select-Object -Last 1
              $status = if ($json) { ("$json" | ConvertFrom-Json).status } else { 'NO_JSON' }
              $lines += "reloaded gate exit=$code status=$status"
              if ($code -ne 0 -or $status -ne 'LATEST_READY') { throw "gate on the pushed commit failed: exit=$code status=$status output: $($gate -join ' ')" }
            } else {
              # Until the merge, GitHub main is still the previous release. What production machines
              # will check afterwards is reproduced without the network: the pushed commit must
              # descend from every installed version, and each installed version's own gate script
              # must accept the pushed tree. The real network run follows on the push to main.
              foreach ($origin in ($env:UPGRADE_ORIGINS -split ';')) {
                $label, $sha = $origin -split '=', 2
                git merge-base --is-ancestor $sha $env:GITHUB_SHA
                if ($LASTEXITCODE -ne 0) { throw "the pushed commit does not descend from $label ($sha)" }
                $lines += "$label gate: $(Test-GateScript $sha $label)"
              }
              $lines += "pushed gate: $(Test-GateScript $env:GITHUB_SHA 'pushed')"
            }
            $head = git rev-parse HEAD
            if ($head -ne $env:GITHUB_SHA) { throw "the working tree is not on the pushed commit: $head" }
            "::notice::GATE $($lines -join ' | ')"
            "GATE=$($lines -join ' > ')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            $msg = (("$($_.Exception.GetType().Name): $($_.Exception.Message)" -replace "`r?`n", ' | ') -replace '%', '%25')
            if ($msg.Length -gt 3500) { $msg = $msg.Substring(0, 3500) + '...' }
            "::error title=Upgrade rehearsal::$msg"
            exit 1
          }

      - name: Consistency check
        id: consistency
        shell: pwsh
        run: |
          $out = python scripts/check_skill_consistency.py 2>&1
          $code = $LASTEXITCODE
          "::notice::CONSISTENCY exit=$code :: $((($out | Select-Object -Last 12) -join ' | ') -replace '%', '%25')"
          if ($code -ne 0) { exit $code }

      - name: Unit tests (includes the Windows publish dry-run gate)
        id: tests
        shell: pwsh
        run: |
          $failed = @()
          $lines = @()
          foreach ($t in 'test_cover_geometry.py', 'test_production_contract.py', 'test_orchestration_contract.py', 'test_editorial_contract.py', 'test_editorial_ledger.py', 'test_performance_review.py') {
            $out = python (Join-Path scripts $t) 2>&1
            $code = $LASTEXITCODE
            $lines += "$t exit=$code [$(($out | Select-Object -Last 1) -join ' ')]"
            if ($code -ne 0) {
              $failed += $t
              $tail = (($out | Select-Object -Last 30) -join ' | ') -replace '%', '%25'
              if ($tail.Length -gt 2800) { $tail = $tail.Substring($tail.Length - 2800) }
              "::error file=scripts/$t::$tail"
            }
          }
          "::notice::TESTS $($lines -join ' ; ')"
          if ($failed.Count) { exit 1 }

      - name: Smoke test (render, mix, assemble, validate, layout proof)
        id: smoke
        shell: pwsh
        run: |
          $out = python scripts/smoke_test_brief_pipeline.py --font $env:SMOKE_FONT --work-dir (Join-Path $env:RUNNER_TEMP 'smoke') 2>&1
          $code = $LASTEXITCODE
          $out | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'smoke.log') -Encoding utf8
          $line = $out | Where-Object { "$_" -like '{*' } | Select-Object -Last 1
          $summary = "exit=$code (no JSON line)"
          if ($line) {
            $r = "$line" | ConvertFrom-Json
            $summary = "$($r.status) frames=$($r.decoded_frames)/$($r.planned_frames) lufs=$($r.final_lufs) failed=$(@($r.failed_checks).Count)"
            if ($r.error) { $out = @("$($r.error)") + $out }
          }
          "::notice::SMOKE $summary"
          "SMOKE=$summary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($code -ne 0 -or $summary -notlike 'SMOKE_PASSED*') {
            $tail = (($out | Select-Object -Last 40) -join ' | ') -replace '%', '%25'
            if ($tail.Length -gt 3000) { $tail = $tail.Substring($tail.Length - 3000) }
            "::error file=scripts/smoke_test_brief_pipeline.py::$tail"
            exit 1
          }

      - name: Reference stills (rebuild as evidence)
        id: reference
        shell: pwsh
        run: |
          $out = python scripts/build_layout_reference.py --font $env:SMOKE_FONT --out-dir (Join-Path $env:RUNNER_TEMP 'reference') --work-dir (Join-Path $env:RUNNER_TEMP 'reference-work') --compare-dir assets/references/v3-reference 2>&1
          $code = $LASTEXITCODE
          $line = $out | Where-Object { "$_" -like '{*' } | Select-Object -Last 1
          $summary = "exit=$code (no JSON line)"
          if ($line) {
            $r = "$line" | ConvertFrom-Json
            $summary = "$($r.status) frames=$($r.frames.full)/$($r.frames.'two-line')/$($r.frames.text)"
            if ($r.compared) { $summary += " committed: $($r.compared -join ', ')" }
            if ($r.error) { $out = @("$($r.error)") + $out }
          }
          "::notice::REFERENCE $summary"
          if ($code -ne 0 -or $summary -notlike 'REFERENCE_BUILT*') {
            $tail = (($out | Select-Object -Last 40) -join ' | ') -replace '%', '%25'
            if ($tail.Length -gt 3000) { $tail = $tail.Substring($tail.Length - 3000) }
            "::error file=scripts/build_layout_reference.py::$tail"
            exit 1
          }

      # Preview helper for people reading the evidence branch. It is not part of the skill and
      # is not allowed to fail the run; its output goes to an annotation because the job
      # summary and the step log both need a sign-in to read.
      - name: Contact sheet (preview only)
        id: sheet
        continue-on-error: true
        shell: pwsh
        run: |
          "::notice::SHEET-START (step script parsed)"
          @'
          import json, subprocess, sys, traceback
          from pathlib import Path
          from PIL import Image, ImageDraw
          try:
              # The smoke step leaves its JSON summary in smoke.log; take the work dir from
              # there instead of guessing how the smoke script laid out --work-dir.
              log = Path(sys.argv[1]) / "smoke.log"
              state = next(json.loads(line) for line in reversed(log.read_text(encoding="utf-8-sig").splitlines()) if line.startswith("{"))
              work = Path(state["work_dir"])
              src = work / "render" / "candidate.mp4"
              print("src", src, "exists", src.exists())
              w, h = 270, 480
              run = subprocess.run(["ffmpeg", "-v", "error", "-i", str(src), "-vf", f"scale={w}:{h}", "-pix_fmt", "rgb24", "-f", "rawvideo", "-"], capture_output=True)
              print("ffmpeg exit", run.returncode, "bytes", len(run.stdout), "stderr", run.stderr[-600:].decode("utf-8", "replace"))
              run.check_returncode()
              raw = run.stdout
              size = w * h * 3
              frames = [Image.frombytes("RGB", (w, h), raw[i:i + size]) for i in range(0, len(raw) - size + 1, size)]
              picks = sorted({0, 1, int(len(frames) * 0.05), int(len(frames) * 0.3), int(len(frames) * 0.55), int(len(frames) * 0.8), len(frames) - 1})
              labels = ["cover", "first body frame", "caption 1", "caption 2", "shot change", "caption 3", "final"]
              sheet = Image.new("RGB", (len(picks) * (w + 4) + 4, h + 28), (245, 245, 245))
              draw = ImageDraw.Draw(sheet)
              for i, n in enumerate(picks):
                  sheet.paste(frames[n], (4 + i * (w + 4), 24))
                  draw.text((6 + i * (w + 4), 6), f"f{n} {labels[i]}", fill=(0, 0, 0))
              sheet.save(work / "smoke-contact-sheet.jpg", quality=90)
              print("frames", len(frames), "sheet", sheet.size)
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'sheet.py')
          $out = python (Join-Path $env:RUNNER_TEMP 'sheet.py') $env:RUNNER_TEMP 2>&1
          $code = $LASTEXITCODE
          $text = (($out | ForEach-Object { "$_" }) -join ' | ') -replace '%', '%25'
          if ($text.Length -gt 3000) { $text = $text.Substring($text.Length - 3000) }
          if ($code -eq 0) {
            "::notice::SHEET $text"
          } else {
            "::error title=Contact sheet helper failed (exit $code)::$text"
            exit 1
          }

      - name: Environment check (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          # This host is not a production machine, so required failures here are expected;
          # what matters is that they are all "tool not installed here", so the FAIL rows
          # are listed in full and the whole log goes to the evidence branch.
          $out = pwsh -NoProfile -File scripts/check_environment.ps1 2>&1
          $code = $LASTEXITCODE
          $out | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'check_environment.log') -Encoding utf8
          $summary = (($out | Where-Object { "$_" -like 'News-Editor ready*' } | Select-Object -Last 1) -join ' ').Trim()
          $fails = ($out | Where-Object { "$_" -match '^\s*FAIL\b' } | ForEach-Object { "$_".Trim() -replace '\s+', ' ' }) -join ' | '
          if ($fails.Length -gt 3500) { $fails = $fails.Substring(0, 3500) + '...' }
          $msg = "ENVIRONMENT check_environment exit=$code :: $summary :: FAIL rows on this host: $fails"
          "::notice::$($msg -replace '%', '%25')"

      - name: Publish evidence
        if: always()
        shell: pwsh
        run: |
          $tmp = $env:RUNNER_TEMP
          $smoke = Join-Path $tmp 'smoke\smoke'
          git checkout -q --orphan $env:ARTIFACT_BRANCH
          git rm -rf --cached -q .
          git clean -fdx -q
          Get-ChildItem $tmp -Filter '*.log' -ErrorAction SilentlyContinue | Copy-Item -Destination .
          foreach ($rel in 'smoke-contact-sheet.jpg', 'render\candidate.mp4', 'render\qa.json') {
            $src = Join-Path $smoke $rel
            if (Test-Path -LiteralPath $src) {
              $folder = Split-Path $rel
              if ($folder) { New-Item -ItemType Directory -Force $folder | Out-Null }
              Copy-Item -LiteralPath $src -Destination $rel
            }
          }
          # Full-size frames extracted by the layout proof step: the Windows render with the
          # production font, cropped per zone plus the whole frames they came from.
          $proof = Join-Path $smoke 'render\proof'
          if (Test-Path -LiteralPath $proof) {
            New-Item -ItemType Directory -Force 'render\proof' | Out-Null
            Copy-Item -Path (Join-Path $proof '*') -Destination 'render\proof' -Recurse
          }
          # Reference stills rebuilt from the pushed commit with the production font.
          if (Test-Path -LiteralPath (Join-Path $tmp 'reference')) {
            New-Item -ItemType Directory -Force 'reference' | Out-Null
            Copy-Item -Path (Join-Path $tmp 'reference\*.png') -Destination 'reference'
          }
          @(
            "run=https://github.com/${{ github.repository }}/actions/runs/${{ github.RUN_ID }}"
            "commit=$env:GITHUB_SHA"
            "font=$env:SMOKE_FONT"
            "gate=$env:GATE"
            "smoke=$env:SMOKE"
          ) | Set-Content -Encoding utf8 RUN.txt
          git add -A
          git -c user.name='github-actions' -c user.email='actions@github.com' commit -q -m "Windows smoke evidence for run $env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $push = git push --force origin $env:ARTIFACT_BRANCH 2>&1
          $code = $LASTEXITCODE
          $text = (($push | ForEach-Object { "$_" }) -join ' | ') -replace '%', '%25'
          if ($code -eq 0) {
            "::notice::EVIDENCE pushed to branch $env:ARTIFACT_BRANCH (run $env:GITHUB_RUN_ID)"
          } else {
            if ($text.Length -gt 3000) { $text = $text.Substring($text.Length - 3000) }
            "::error title=Evidence push failed (git push exit $code)::$text"
            exit 1
          }
