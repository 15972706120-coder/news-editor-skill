name: Windows smoke

# Rehearses what a production Windows machine goes through, on GitHub's own Windows host.
# The installed version is checked out first, then the gate script fast-forwards it to GitHub
# main, which runs the OLD script's post-update validation for real. Afterwards the 2.x gates
# and the brief pipeline run. Nothing here changes main or touches a production machine.
# Diagnostics go to annotations and evidence is pushed to a scratch branch, so the result can
# be inspected without signing in.

on:
  push:
    branches: [main, v3-brief]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  UPGRADE_FROM: 6fb1d3bc3bfeb74fdaa813200ba18223903a7dbd
  ARTIFACT_BRANCH: ci/windows-smoke

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { Write-Host 'ffmpeg already on PATH'; exit 0 }
          try {
            $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest' -Headers @{ 'User-Agent' = 'news-editor-smoke' }
            $asset = $release.assets | Where-Object { $_.name -match '^ffmpeg-n[\d.]+-latest-win64-gpl-[\d.]+\.zip$' } | Select-Object -First 1
            if (-not $asset) { throw 'no win64 gpl asset in the BtbN latest release' }
            $zip = Join-Path $env:RUNNER_TEMP $asset.name
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip -TimeoutSec 420
            $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $bin = Get-ChildItem $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | Select-Object -ExpandProperty DirectoryName
            $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "installed $($asset.name)"
          } catch {
            Write-Host "static build failed ($($_.Exception.Message)); falling back to Chocolatey"
            Choco Install ffmpeg -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Toolchain
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Note([string]$m) {
            $one = (($m -replace "`r?`n", ' | ') -replace '%', '%25')
            if ($one.Length -gt 3000) { $one = $one.Substring(0, 3000) + '...' }
            "::notice::$one"
            $one | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'notes.log') -Append -Encoding utf8
          }
          try {
            $ff = (ffmpeg -version | Select-Object -First 1)
            $fp = (ffprobe -version | Select-Object -First 1)
            Note "TOOLCHAIN ffmpeg: $ff | ffprobe: $fp | $(pwsh --version) | $(python --version)"
            $font = 'C:\Windows\Fonts\msyhbd.ttc'
            if (-not (Test-Path -LiteralPath $font)) {
              $cjk = Get-ChildItem C:\Windows\Fonts -Include msyh*, simhei*, Deng*, simsun*, *NotoSans*CJK*, *SourceHan* -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
              Note "FONT Microsoft YaHei Bold is not installed on this image; CJK fonts present: $($cjk -join ', ')"
              $font = Join-Path $env:RUNNER_TEMP 'NotoSansCJKsc-Bold.otf'
              $urls = @(
                'https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf',
                'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf'
              )
              $done = $false
              foreach ($u in $urls) {
                try {
                  Invoke-WebRequest -Uri $u -OutFile $font -TimeoutSec 240
                  if ((Get-Item $font).Length -gt 1MB) { $done = $true; break }
                } catch { Write-Host "font download failed from $u : $($_.Exception.Message)" }
              }
              if (-not $done) { throw 'no CJK bold font available on this host' }
            }
            python -c "from PIL import ImageFont; f = ImageFont.truetype(r'$font', 40); print('font ok:', f.getname())"
            if ($LASTEXITCODE -ne 0) { throw 'Pillow cannot load the selected font' }
            Note "FONT smoke font: $font"
            "SMOKE_FONT=$font" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "FF=$ff" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            $msg = (("$($_.Exception.GetType().Name): $($_.Exception.Message)" -replace "`r?`n", ' | ') -replace '%', '%25')
            "::error title=Toolchain::$msg"
            exit 1
          }

      - name: PowerShell syntax
        id: syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
          "::notice::POWERSHELL all scripts parse on $(pwsh --version)"

      - name: Production upgrade path (installed version to main through the gate script)
        id: upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            git remote set-url origin https://github.com/15972706120-coder/news-editor-skill.git
            git checkout -q -B main $env:UPGRADE_FROM
            $dirty = git status --porcelain=v1 --untracked-files=all
            if ($dirty) { throw "worktree is not clean: $dirty" }
            $before = "installed before gate: $(git rev-parse --short HEAD) VERSION=$(Get-Content VERSION)"
            $first = & pwsh -NoProfile -File scripts/ensure_latest_skill.ps1 -RunId ([guid]::NewGuid().ToString())
            $firstCode = $LASTEXITCODE
            $afterFirst = "after first gate: $(git rev-parse --short HEAD) VERSION=$(Get-Content VERSION)"
            $second = & pwsh -NoProfile -File scripts/ensure_latest_skill.ps1 -RunId ([guid]::NewGuid().ToString())
            $secondCode = $LASTEXITCODE
            $j1 = $first | Where-Object { "$_" -like '{*' } | Select-Object -Last 1
            $j2 = $second | Where-Object { "$_" -like '{*' } | Select-Object -Last 1
            $s1 = if ($j1) { ("$j1" | ConvertFrom-Json).status } else { 'NO_JSON' }
            $s2 = if ($j2) { ("$j2" | ConvertFrom-Json).status } else { 'NO_JSON' }
            "::notice::GATE-OLD $before | exit=$firstCode status=$s1 | $afterFirst | output: $($first -join ' ')"
            "::notice::GATE-NEW exit=$secondCode status=$s2 | output: $($second -join ' ')"
            "GATE1=$s1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "GATE2=$s2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            if ($s1 -ne 'UPDATED_READY_RELOAD' -or $s2 -ne 'LATEST_READY' -or $firstCode -ne 0 -or $secondCode -ne 0) { exit 1 }
          } catch {
            $msg = (("$($_.Exception.GetType().Name): $($_.Exception.Message)" -replace "`r?`n", ' | ') -replace '%', '%25')
            "::error title=Upgrade path::$msg"
            exit 1
          }

      - name: Consistency check
        id: consistency
        shell: pwsh
        run: |
          $out = python scripts/check_skill_consistency.py 2>&1
          $code = $LASTEXITCODE
          "::notice::CONSISTENCY exit=$code :: $((($out | Select-Object -Last 12) -join ' | ') -replace '%', '%25')"
          if ($code -ne 0) { exit $code }

      - name: Unit tests (includes the Windows publish dry-run gate)
        id: tests
        shell: pwsh
        run: |
          $failed = @()
          $lines = @()
          foreach ($t in 'test_cover_geometry.py', 'test_production_contract.py', 'test_orchestration_contract.py', 'test_editorial_contract.py', 'test_editorial_ledger.py', 'test_performance_review.py') {
            $out = python (Join-Path scripts $t) 2>&1
            $code = $LASTEXITCODE
            $lines += "$t exit=$code [$(($out | Select-Object -Last 1) -join ' ')]"
            if ($code -ne 0) {
              $failed += $t
              $tail = (($out | Select-Object -Last 30) -join ' | ') -replace '%', '%25'
              if ($tail.Length -gt 2800) { $tail = $tail.Substring($tail.Length - 2800) }
              "::error file=scripts/$t::$tail"
            }
          }
          "::notice::TESTS $($lines -join ' ; ')"
          if ($failed.Count) { exit 1 }

      - name: Smoke test (render, mix, assemble, validate, layout proof)
        id: smoke
        shell: pwsh
        run: |
          $out = python scripts/smoke_test_brief_pipeline.py --font $env:SMOKE_FONT --work-dir (Join-Path $env:RUNNER_TEMP 'smoke') 2>&1
          $code = $LASTEXITCODE
          $out | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'smoke.log') -Encoding utf8
          $line = $out | Where-Object { "$_" -like '{*' } | Select-Object -Last 1
          $summary = "exit=$code (no JSON line)"
          if ($line) {
            $r = "$line" | ConvertFrom-Json
            $summary = "$($r.status) frames=$($r.decoded_frames)/$($r.planned_frames) lufs=$($r.final_lufs) failed=$(@($r.failed_checks).Count)"
            if ($r.error) { $out = @("$($r.error)") + $out }
          }
          "::notice::SMOKE $summary"
          "SMOKE=$summary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($code -ne 0 -or $summary -notlike 'SMOKE_PASSED*') {
            $tail = (($out | Select-Object -Last 40) -join ' | ') -replace '%', '%25'
            if ($tail.Length -gt 3000) { $tail = $tail.Substring($tail.Length - 3000) }
            "::error file=scripts/smoke_test_brief_pipeline.py::$tail"
            exit 1
          }

      - name: Contact sheet
        id: sheet
        shell: pwsh
        run: |
          @'
          import subprocess, sys
          from pathlib import Path
          from PIL import Image, ImageDraw
          work = Path(sys.argv[1]) / "smoke"
          src = work / "render" / "candidate.mp4"
          w, h = 270, 480
          raw = subprocess.run(["ffmpeg", "-v", "error", "-i", str(src), "-vf", f"scale={w}:{h}", "-pix_fmt", "rgb24", "-f", "rawvideo", "-"], capture_output=True, check=True).stdout
          size = w * h * 3
          frames = [Image.frombytes("RGB", (w, h), raw[i:i + size]) for i in range(0, len(raw) - size + 1, size)]
          picks = sorted({0, 1, int(len(frames) * 0.05), int(len(frames) * 0.3), int(len(frames) * 0.55), int(len(frames) * 0.8), len(frames) - 1})
          labels = ["cover", "first body frame", "caption 1", "caption 2", "shot change", "caption 3", "final"]
          sheet = Image.new("RGB", (len(picks) * (w + 4) + 4, h + 28), (245, 245, 245))
          draw = ImageDraw.Draw(sheet)
          for i, n in enumerate(picks):
              sheet.paste(frames[n], (4 + i * (w + 4), 24))
              draw.text((6 + i * (w + 4), 6), f"f{n} {labels[i]}", fill=(0, 0, 0))
          sheet.save(work / "smoke-contact-sheet.jpg", quality=90)
          print("frames", len(frames), "sheet", sheet.size)
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'sheet.py')
          python (Join-Path $env:RUNNER_TEMP 'sheet.py') $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Environment check (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $out = pwsh -NoProfile -File scripts/check_environment.ps1 2>&1
          $code = $LASTEXITCODE
          $tail = (($out | Select-Object -Last 10) -join ' | ') -replace '%', '%25'
          if ($tail.Length -gt 2500) { $tail = $tail.Substring($tail.Length - 2500) }
          "::notice::ENVIRONMENT check_environment exit=$code :: $tail"

      - name: Publish summary as a commit status
        if: always()
        shell: pwsh
        env:
          SYNTAX: ${{ steps.syntax.outcome }}
          UPGRADE: ${{ steps.upgrade.outcome }}
          CONSISTENCY: ${{ steps.consistency.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          $ok = @($env:SYNTAX, $env:UPGRADE, $env:CONSISTENCY, $env:TESTS, $env:SMOKE_OUTCOME | Where-Object { $_ -ne 'success' }).Count -eq 0
          $state = if ($ok) { 'success' } else { 'failure' }
          $ff = ($env:FF -replace '^ffmpeg version ', '') -replace ' .*$', ''
          $summary = "gate=$env:GATE1>$env:GATE2 | $env:SMOKE | ff=$ff | syntax=$env:SYNTAX tests=$env:TESTS consistency=$env:CONSISTENCY"
          if ($summary.Length -gt 250) { $summary = $summary.Substring(0, 250) }
          try {
            $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
            $body = @{ state = $state; context = 'Windows smoke'; description = $summary } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.SHA }}" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $body | Out-Null
            "::notice::STATUS posted: $state $summary"
          } catch {
            $msg = (("$($_.Exception.GetType().Name): $($_.Exception.Message)" -replace "`r?`n", ' | ') -replace '%', '%25')
            "::warning title=Commit status not posted::$msg | intended: $state $summary"
          }

      - name: Publish evidence
        if: always()
        shell: pwsh
        run: |
          $tmp = $env:RUNNER_TEMP
          $smoke = Join-Path $tmp 'smoke\smoke'
          git checkout -q --orphan $env:ARTIFACT_BRANCH
          git rm -rf --cached -q .
          git clean -fdx -q
          Get-ChildItem $tmp -Filter '*.log' -ErrorAction SilentlyContinue | Copy-Item -Destination .
          foreach ($rel in 'smoke-contact-sheet.jpg', 'render\candidate.mp4', 'proof\cover.png', 'proof\caption-02-settled.png', 'proof\caption-02-header.png', 'proof\caption-02-footage.png') {
            $src = Join-Path $smoke $rel
            if (Test-Path -LiteralPath $src) {
              $folder = Split-Path $rel
              if ($folder) { New-Item -ItemType Directory -Force $folder | Out-Null }
              Copy-Item -LiteralPath $src -Destination $rel
            }
          }
          @(
            "run=https://github.com/${{ github.repository }}/actions/runs/${{ github.RUN_ID }}"
            "sha=$env:GITHUB_SHA"
            "font=$env:SMOKE_FONT"
            "gate=$env:GATE1 > $env:GATE2"
            "smoke=$env:SMOKE"
          ) | Set-Content -Encoding utf8 RUN.txt
          git add -A
          git -c user.name='github-actions' -c user.email='actions@github.com' commit -q -m "Windows smoke evidence for run $env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $push = git push --force origin $env:ARTIFACT_BRANCH 2>&1
          $code = $LASTEXITCODE
          $text = (($push | ForEach-Object { "$_" }) -join ' | ') -replace '%', '%25'
          if ($code -eq 0) {
            "::notice::EVIDENCE pushed to branch $env:ARTIFACT_BRANCH (run $env:GITHUB_RUN_ID)"
          } else {
            if ($text.Length -gt 3000) { $text = $text.Substring($text.Length - 3000) }
            "::error title=Evidence push failed (git push exit $code)::$text"
            exit 1
          }
